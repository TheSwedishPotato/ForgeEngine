<title>Coin Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One full-screen arcade view: canvas behind, score top-left, centered title card. */
:root{--bg:#0e1511;--fg:#f4f1e6;--accent:#ffd23f;--muted:#9fb3a4;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:600 20px/1.3 system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 1px 4px #000}
#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px));font-size:clamp(28px,6vw,48px);text-shadow:0 2px 10px #000}
#msg small{display:block;margin-top:10px;font-size:16px;font-weight:500;color:var(--muted)}
</style>
<canvas tabindex="0"></canvas><div id="hud"></div>
<div id="msg"><div>Coin Rush<small>WASD or arrow keys to move. Grab coins for 30 seconds.<br>Click the game, then press Space.</small></div></div>
<script type="module" src="main.web.js"></script>
