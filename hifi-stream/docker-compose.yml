# Local development stack: Postgres + Go API + Next.js.
#   docker compose up --build
# then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hifi
      POSTGRES_PASSWORD: hifi
      POSTGRES_DB: hifi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hifi"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://hifi:hifi@db:5432/hifi?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      PUBLIC_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:3000
      DEV_FAKE_BILLING: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
    ports:
      - "8080:8080"
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  media:
